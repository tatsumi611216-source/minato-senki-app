name: Android Build (unsigned AAB)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'www/**'
      - 'assets/**'
      - 'capacitor.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Add Android platform (if missing)
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Generate launcher icons from app icon
        run: |
          cp assets/icon-1024.png assets/icon.png
          npx -y @capacitor/assets generate --android || echo "icon generation skipped"

      - name: Sync web assets
        run: npx cap sync android

      - name: Build unsigned release bundle
        working-directory: android
        run: ./gradlew bundleRelease

      - name: Upload unsigned AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-unsigned
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
